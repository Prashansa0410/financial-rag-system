[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findoc-rag"
version = "1.0.0"
description = "Enterprise Hybrid RAG & Cross-Encoder Reranking Engine for SEC Financial Filings"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "FinDoc-RAG Team" }
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "financial-nlp",
    "sec-filings",
    "faiss",
    "bm25",
    "hybrid-search",
    "cross-encoder",
    "reranking",
    "qwen2.5",
    "llama3.1",
    "llm-judge"
]
dependencies = [
    "torch>=2.1.0",
    "sentence-transformers>=2.2.2",
    "faiss-cpu>=1.7.4",
    "rank-bm25>=0.2.2",
    "transformers>=4.38.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "requests>=2.31.0"
]

[project.scripts]
findoc-rag = "main:main"

[tool.setuptools.packages.find]
where = ["src"]
